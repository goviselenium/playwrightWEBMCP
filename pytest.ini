[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -v --strict-markers
markers =
    webmcp: WebMCP model context contract, tool schema, and execution tests
    integration: Network request, API payload, and endpoint integrity tests
    system: Multi-step UI locators, state assertions, and navigation tests
    uat: User acceptance testing, responsive viewports, and conversion journeys
    autonomous: Ollama LLM autonomous evaluations, DOM accessibility heuristics, and smart assertions
